<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#121218">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>GymTrack</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" id="manifest">
</head>
<body>
<header class="topbar">
  <h1>💪 GymTrack</h1>
  <button id="timerChip" class="chip hidden" title="Cronómetro de descanso">⏱ --:--</button>
  <button id="btnTimer" class="icon-btn" title="Cronómetro de descanso" aria-label="Cronómetro">⏱</button>
  <button id="btnEditRoutine" class="icon-btn" title="Editar rutina" aria-label="Editar rutina">✏️</button>
  <button id="btnSettings" class="icon-btn" title="Ajustes y backup" aria-label="Ajustes">⚙️</button>
</header>

<nav class="tabs">
  <button data-tab="entreno" class="tab active">Entreno</button>
  <button data-tab="historial" class="tab">Historial</button>
  <button data-tab="progreso" class="tab">Progreso</button>
</nav>

<!-- ============ TAB ENTRENO ============ -->
<main id="tab-entreno" class="page active">
  <div id="backupBanner" class="banner hidden">
    <span id="backupText"></span>
    <button id="btnBannerExport" class="btn-small">Exportar</button>
  </div>
  <div class="selector-row">
    <div class="day-buttons" id="dayButtons"></div>
  </div>
  <div class="selector-row">
    <label class="lbl" for="dateInput">Fecha</label>
    <input type="date" id="dateInput">
  </div>
  <div id="exerciseList"></div>

  <div class="savebar">
    <div class="savebar-info">
      <div id="progressText" class="savebar-text">0/0 series</div>
      <div class="pbar"><i id="pbarFill"></i></div>
    </div>
    <button id="btnSave" class="btn-primary">Guardar</button>
  </div>
</main>

<!-- ============ TAB HISTORIAL ============ -->
<main id="tab-historial" class="page">
  <div id="historyList"></div>
</main>

<!-- ============ TAB PROGRESO ============ -->
<main id="tab-progreso" class="page">
  <label class="lbl" for="progressSelect">Ejercicio</label>
  <select id="progressSelect"></select>

  <div id="progressEmpty" class="empty-state hidden">
    <div class="empty-icon">📈</div>
    <p>Todavía no hay datos de este ejercicio.</p>
    <p class="muted">Guardá una sesión y acá vas a ver tu récord, 1RM estimado y la evolución.</p>
    <button id="btnGoTrain" class="btn-primary">Ir a entrenar</button>
  </div>

  <div id="progressContent" class="hidden">
    <div id="progressStats" class="stats"></div>
    <div class="chart-block">
      <h3>Mejor peso por sesión (kg)</h3>
      <canvas id="chartPeso"></canvas>
    </div>
    <div class="chart-block">
      <h3>Volumen total (kg × reps)</h3>
      <canvas id="chartVolumen"></canvas>
    </div>
  </div>
</main>

<!-- ============ MODAL CRONÓMETRO ============ -->
<div id="timerModal" class="modal hidden">
  <div class="modal-content">
    <h2>Descanso</h2>
    <div id="timerDisplay" class="timer-display">--:--</div>
    <div class="timer-btns">
      <button data-sec="60" class="btn-secondary timer-preset">1:00</button>
      <button data-sec="90" class="btn-secondary timer-preset">1:30</button>
      <button data-sec="120" class="btn-secondary timer-preset">2:00</button>
      <button data-sec="180" class="btn-secondary timer-preset">3:00</button>
    </div>
    <button id="timerStop" class="btn-danger btn-big">Parar</button>
    <button id="timerClose" class="btn-secondary btn-big">Cerrar</button>
  </div>
</div>

<!-- ============ MODAL AJUSTES ============ -->
<div id="settingsModal" class="modal hidden">
  <div class="modal-content">
    <h2>Ajustes</h2>
    <div class="setting-row">
      <label for="setRest">Descanso por defecto</label>
      <select id="setRest">
        <option value="60">1:00</option>
        <option value="90">1:30</option>
        <option value="120">2:00</option>
        <option value="150">2:30</option>
        <option value="180">3:00</option>
      </select>
    </div>
    <div class="setting-row">
      <label for="setAuto">Iniciar descanso al marcar ✓</label>
      <input type="checkbox" id="setAuto">
    </div>
    <h3 class="sub">Backup</h3>
    <p id="backupInfo" class="muted"></p>
    <div class="io-row">
      <button id="btnExport" class="btn-secondary">⬇ Exportar JSON</button>
      <button id="btnImport" class="btn-secondary">⬆ Importar JSON</button>
      <input type="file" id="fileImport" accept="application/json" hidden>
    </div>
    <button id="btnCloseSettings" class="btn-primary btn-big">Listo</button>
  </div>
</div>

<!-- ============ MODAL EDITAR RUTINA ============ -->
<div id="routineModal" class="modal hidden">
  <div class="modal-content modal-wide">
    <h2>Editar rutina</h2>
    <div id="routineEditor"></div>
    <button id="btnSaveRoutine" class="btn-primary btn-big">Guardar rutina</button>
    <button id="btnCloseRoutine" class="btn-secondary btn-big">Cancelar</button>
  </div>
</div>

<!-- ============ MODAL DETALLE SESIÓN (historial) ============ -->
<div id="sessionModal" class="modal hidden">
  <div class="modal-content modal-wide">
    <h2 id="sessionModalTitle">Sesión</h2>
    <div id="sessionDetail"></div>
    <button id="btnEditSession" class="btn-primary btn-big">Editar</button>
    <button id="btnDeleteSession" class="btn-danger btn-big">Borrar sesión</button>
    <button id="btnCloseSession" class="btn-secondary btn-big">Cerrar</button>
  </div>
</div>

<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
