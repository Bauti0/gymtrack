<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#121218">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>GymTrack</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" id="manifest">
</head>
<body>
<header class="topbar">
  <h1>💪 GymTrack</h1>
  <button id="btnTimer" class="icon-btn" title="Cronómetro de descanso">⏱</button>
  <button id="btnEditRoutine" class="icon-btn" title="Editar rutina">✏️</button>
</header>

<nav class="tabs">
  <button data-tab="entreno" class="tab active">Entreno</button>
  <button data-tab="historial" class="tab">Historial</button>
  <button data-tab="progreso" class="tab">Progreso</button>
</nav>

<!-- ============ TAB ENTRENO ============ -->
<main id="tab-entreno" class="page active">
  <div class="selector-row">
    <div class="day-buttons" id="dayButtons"></div>
  </div>
  <div class="selector-row">
    <label class="lbl" for="dateInput">Fecha</label>
    <input type="date" id="dateInput">
  </div>
  <div id="exerciseList"></div>
  <button id="btnSave" class="btn-primary btn-big">Guardar sesión</button>
  <div class="io-row">
    <button id="btnExport" class="btn-secondary">⬇ Exportar JSON</button>
    <button id="btnImport" class="btn-secondary">⬆ Importar JSON</button>
    <input type="file" id="fileImport" accept="application/json" hidden>
  </div>
</main>

<!-- ============ TAB HISTORIAL ============ -->
<main id="tab-historial" class="page">
  <div id="historyList"></div>
</main>

<!-- ============ TAB PROGRESO ============ -->
<main id="tab-progreso" class="page">
  <label class="lbl" for="progressSelect">Ejercicio</label>
  <select id="progressSelect"></select>
  <div class="chart-block">
    <h3>Mejor peso por sesión (kg)</h3>
    <canvas id="chartPeso" width="600" height="300"></canvas>
  </div>
  <div class="chart-block">
    <h3>Volumen total (kg × reps)</h3>
    <canvas id="chartVolumen" width="600" height="300"></canvas>
  </div>
</main>

<!-- ============ MODAL CRONÓMETRO ============ -->
<div id="timerModal" class="modal hidden">
  <div class="modal-content">
    <h2>Descanso</h2>
    <div id="timerDisplay" class="timer-display">--:--</div>
    <div class="timer-btns">
      <button data-sec="90" class="btn-secondary timer-preset">1:30</button>
      <button data-sec="120" class="btn-secondary timer-preset">2:00</button>
      <button data-sec="180" class="btn-secondary timer-preset">3:00</button>
    </div>
    <button id="timerStop" class="btn-danger btn-big">Parar</button>
  </div>
</div>

<!-- ============ MODAL EDITAR RUTINA ============ -->
<div id="routineModal" class="modal hidden">
  <div class="modal-content modal-wide">
    <h2>Editar rutina</h2>
    <div id="routineEditor"></div>
    <button id="btnSaveRoutine" class="btn-primary btn-big">Guardar rutina</button>
    <button id="btnCloseRoutine" class="btn-secondary btn-big">Cancelar</button>
  </div>
</div>

<!-- ============ MODAL DETALLE SESIÓN (historial) ============ -->
<div id="sessionModal" class="modal hidden">
  <div class="modal-content modal-wide">
    <h2 id="sessionModalTitle">Sesión</h2>
    <div id="sessionDetail"></div>
    <button id="btnEditSession" class="btn-primary btn-big">Editar</button>
    <button id="btnDeleteSession" class="btn-danger btn-big">Borrar sesión</button>
    <button id="btnCloseSession" class="btn-secondary btn-big">Cerrar</button>
  </div>
</div>

<div id="toast" class="toast hidden"></div>
<script src="app.js"></script>
</body>
</html>
